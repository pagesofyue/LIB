<style>
:root{--bg:#ece6f2;--fg:#2d2438;--panel:#fff;--line:#d6cbe3;--acc:#6b4fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181320;--fg:#ece6f5;--panel:#272033;--line:#40365a;--acc:#b79af0}}
:root[data-theme="dark"]{--bg:#181320;--fg:#ece6f5;--panel:#272033;--line:#40365a;--acc:#b79af0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Courier Prime',monospace;min-height:100%}
[hidden]{display:none!important}
header{padding:16px 16px 4px;max-width:900px;margin:0 auto}
h1{font-family:'Special Elite',monospace;font-weight:400;font-size:26px;margin:0}
#back{display:inline-block;margin-bottom:8px;color:var(--acc);font-weight:700;text-decoration:none;font-size:14px}
#back:hover{text-decoration:underline}
.bar{max-width:900px;margin:10px auto;padding:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sep{width:1px;align-self:stretch;background:var(--line)}
button,select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,.sw:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.go{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
button:disabled,select:disabled,input:disabled{opacity:.4;cursor:default}
input[type=number],input[type=text],input[type=url],input:not([type]){font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
input[type=number]{width:62px}
#tag{width:150px}
#sizeR{width:90px;accent-color:var(--acc)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.18);padding:0;cursor:pointer}
.sw.on{outline:2px solid var(--acc);outline-offset:2px}
.lbl{font-size:12px;opacity:.7}
.f{display:flex;flex-direction:column;font-size:12px;gap:2px}
.f input{min-width:150px}
.f input[type=color]{min-width:48px;width:48px;height:34px;padding:2px}
#selInfo{font-size:13px;opacity:.75}
#ifont{max-width:170px}
/* menus */
.dd{position:relative}
.dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:210px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(40,20,70,.25);flex-direction:column;gap:2px}
.dd.up .dd-menu{top:auto;bottom:calc(100% + 4px)}
.dd.open .dd-menu{display:flex}
.dd-menu button{border:none;text-align:left;background:transparent;width:100%}
.dd-menu button:hover{background:var(--bg)}
.dd-grid{display:flex;flex-wrap:wrap;gap:2px;max-width:220px;border-top:1px solid var(--line);margin-top:2px;padding-top:4px}
.dd-menu .dd-grid button{width:34px;text-align:center;font-size:20px;padding:3px}
/* tabs */
#pager{max-width:900px;margin:0 auto 10px;padding:0 10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
#tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:8px 8px 0 0;border-bottom:4px solid var(--tc,var(--line))}
.tab.on{background:var(--tc);color:#2d2438;font-weight:700}
/* page */
#wrap{max-width:900px;margin:0 auto 24px;padding:0 10px;position:relative}
#wrap.wide{max-width:1250px}
#frame{position:relative;width:100%}
#page{position:absolute;left:0;top:0;width:820px;height:1100px;transform-origin:0 0;overflow:hidden;border-radius:4px;box-shadow:0 10px 30px rgba(40,20,70,.25);touch-action:pan-y}
.bar.bottom{margin:0 auto 28px}
#file{display:none}
/* cover spread */
.cvr{position:absolute;inset:0}
.cp{position:absolute;top:0;bottom:0;overflow:hidden;background:#e6dff0;color:#3f2d66}
.cp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:14px}
.ph b{font:700 58px/1.1 'Playfair Display',serif}
.ph i{font:22px 'Special Elite',monospace;font-style:normal}
.ph.s{justify-content:flex-end;font:16px 'Special Elite',monospace;opacity:.5}
.cp.spine{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:40px 6px 36px}
.cp.spine::before,.cp.spine::after{content:"";position:absolute;top:0;bottom:0;width:14px;pointer-events:none;z-index:3}
.cp.spine::before{left:0;background:linear-gradient(to right,rgba(0,0,0,.3),rgba(0,0,0,0))}
.cp.spine::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.3),rgba(0,0,0,0))}
.spw{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.st{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);font:700 40px/1.05 'Playfair Display',serif;letter-spacing:.08em;white-space:nowrap}
.si{font:400 56px/1 'Special Elite',monospace;text-align:center;margin-top:40px;white-space:nowrap;flex:none}
.si:empty{display:none}
.si{position:relative}
.cp.spine.img .st,.cp.spine.img .si{text-shadow:0 1px 4px rgba(0,0,0,.55)}
.cvb{display:block}
.cvtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px}
.cvtabs{display:flex;gap:6px;flex-wrap:wrap}
.cvtabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cvmeta{display:flex;gap:8px;flex-wrap:wrap}
.cvpn{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cvpn[hidden],#cvadj[hidden]{display:none}
#cvadj{margin-top:8px}
#cvadj input[type=range]{width:90px;accent-color:var(--acc)}
label.lbl{display:flex;gap:4px;align-items:center}
textarea{font:inherit;font-size:14px;width:100%;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;resize:vertical}
.lr{display:flex;gap:6px;margin-bottom:6px}.lr input{flex:1;min-width:0}.lr input:first-child{flex:0 0 150px}
/* info page */
.inf{position:absolute;inset:0}
.ic{position:absolute;left:60px;top:60px;width:250px;height:375px;overflow:hidden;background:#e6dff0;color:#3f2d66;box-shadow:3px 6px 14px rgba(40,20,70,.3);display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font:700 26px 'Playfair Display',serif}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.im{position:absolute;left:340px;top:60px;right:60px;display:flex;flex-direction:column;gap:10px}
.im h2{font:700 44px/1.1 'Playfair Display',serif;margin:0}
.im .au{font-size:26px}.im .hd{font-size:19px;opacity:.75}.im .se{font-size:20px}
.rt{position:relative;display:inline-block;color:#c9c1d6;font-size:38px;line-height:1;letter-spacing:2px;white-space:nowrap}
.rt i{position:absolute;left:0;top:0;width:var(--p);overflow:hidden;white-space:nowrap;color:#f2b01e;font-style:normal}
.rn{font-size:18px;opacity:.75;margin-left:10px;letter-spacing:0;display:inline-block}
.ib{position:absolute;left:60px;right:60px;top:470px;bottom:360px;overflow:hidden;white-space:pre-wrap;font-size:19px;line-height:1.55}
.iq{position:absolute;left:40px;right:40px;bottom:40px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:16px}
.qt{width:120px;text-align:center}.qt canvas{display:block;width:120px;height:120px;background:#fff;border-radius:4px}
.ql{font-size:14px;margin-top:6px;line-height:1.2;word-break:break-word}
/* items */
.item{position:absolute;touch-action:none;cursor:grab}
.item.sel{outline:2px dashed var(--acc);outline-offset:4px}
.item .body{outline:none;white-space:pre-wrap;word-break:break-word;min-height:1.4em;cursor:text}
.note{padding:22px 16px 18px;box-shadow:2px 5px 10px rgba(40,20,70,.22);line-height:1.35}
.note::before,.photo::before{content:"";position:absolute;left:50%;top:-9px;width:64px;height:18px;margin-left:-32px;background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.12);transform:rotate(-2deg)}
.photo::before{background:rgba(190,170,235,.7)}
.tag{display:inline-block;font-size:.7em;letter-spacing:.04em;border-radius:10px;padding:2px 9px;margin-bottom:6px;background:rgba(45,36,56,.13)}
.note.quote{padding:40px 22px 18px}
.note.quote::after{content:"“";position:absolute;left:12px;top:-2px;font:68px/1 Georgia,serif;opacity:.3}
.note.quote .body{font-style:italic}
.note.quote .tag{display:block;background:none;text-align:right;margin:10px 0 0;padding:0}
.note.quote .tag::before{content:"— "}
.note.spoiler:not(.sel) .body{filter:blur(7px)}
.text{padding:4px 6px;line-height:1.4}
.photo{padding:12px;background:#fff;border-radius:2px;box-shadow:2px 6px 14px rgba(40,20,70,.3),0 0 0 1px rgba(0,0,0,.05);line-height:1.2}
.pwell{position:relative;background:var(--well,#e4deec);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 3px 10px rgba(0,0,0,.2);overflow:hidden}
.photo .pwell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center;pointer-events:none;user-select:none}
#page.adjusting .item.sel .pwell{cursor:move;outline:2px solid var(--acc);outline-offset:-3px}
.photo .body{margin-top:12px;min-height:2.3em;text-align:center}
.photo .body:empty::before{content:"Add a caption";opacity:.45}
.image{padding:0;background:transparent}
.image img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.sticker,.rating{line-height:1;text-align:center;white-space:nowrap;user-select:none}
.rating{letter-spacing:2px}
.tape{height:30px;opacity:.88;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.arrow svg{display:block;width:100%;height:auto;pointer-events:none}
.rs{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:var(--acc);display:none;cursor:nwse-resize;border:2px solid #fff}
.rot{position:absolute;left:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;border:2px solid #fff;display:none;cursor:grab;font-size:11px;line-height:14px;text-align:center;touch-action:none}
.sel .rs,.sel .rot{display:block}
</style></head>

const roman=n=>{if(!(n>0&&n<4000))return String(n);let o="";for(const[v,r]of[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]])while(n>=v){o+=r;n-=v}return o};

 if(!wr){pb.textContent="back cover";back.append(pb);const b=document.createElement("b"),i2=document.createElement("i");b.textContent=T;i2.textContent=c.author||"";pf.append(b,i2);fr.append(pf)}

 const sw=div("spw"),st=div("st"),si=div("si");st.textContent=T;si.textContent=idx;

function fitSpine(re){

 const sw=sp.querySelector(".spw"),st=sp.querySelector(".st"),si=sp.querySelector(".si");if(!sw||!st||!si)return;
 const c=S.cover,txt=st.textContent,Wd=sw.clientWidth;
 if(!re&&document.fonts&&(txt||si.textContent))Promise.all([document.fonts.load(`${st.style.fontWeight||700} 40px ${st.style.fontFamily||"'Playfair Display'"}`,txt||si.textContent),document.fonts.load("400 56px 'Special Elite'",si.textContent||"IV")]).then(()=>{if(page.contains(sp))fitSpine(1)}).catch(()=>{});
 if(si.textContent){let f=+c.spineNum||56;si.style.fontSize=f+"px";if(!c.spineNum&&si.offsetWidth>Wd*.9){f=Math.floor(f*Wd*.9/si.offsetWidth);si.style.fontSize=f+"px"}$("#cSpNum").value=f}

 const vis=(fs,ls)=>{st.style.fontSize=fs+"px";st.style.letterSpacing=ls+"px";st.style.paddingLeft=ls+"px";return st.offsetWidth-2*ls};
 let fs=+c.spineSize;
 if(!fs){let lo=10,hi=Math.floor(Wd*.95);while(hi-lo>.5){const m=(lo+hi)/2;if(vis(m,.08*m)<=H)lo=m;else hi=m}fs=lo}
 const l=.08*fs;st.style.fontSize=fs+"px";st.style.letterSpacing=l+"px";st.style.paddingLeft=l+"px";$("#cSpSize").value=Math.round(fs)}

function qrCanvas(url){
 try{const q=qrcode(0,"M");q.addData(url);q.make();const n=q.getModuleCount(),cell=Math.max(2,Math.floor(480/(n+4))),px=(n+4)*cell,cv=document.createElement("canvas");cv.width=cv.height=px;

  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+2)*cell,(r+2)*cell,cell,cell);return cv}

let d=null;
page.addEventListener("pointerdown",e=>{
 const it=e.target.closest(".item");
 if(!it){select(null);document.activeElement.blur();return}

  d={m,it,pan:true,sx:e.clientX,sy:e.clientY,ox:m.px||0,oy:m.py||0,ww:w.offsetWidth,wh:w.offsetHeight,moved:false};it.setPointerCapture(e.pointerId);return}

 d={m,it,rs,ro,sx:e.clientX,sy:e.clientY,ox:m.x,oy:m.y,ow:m.w,moved:false};
 if(ro){const q=it.getBoundingClientRect();d.cx=q.left+q.width/2;d.cy=q.top+q.height/2;d.a0=Math.atan2(e.clientY-d.cy,e.clientX-d.cx);d.r0=m.rot}

 const dx=(e.clientX-d.sx)/scale,dy=(e.clientY-d.sy)/scale;
 if(Math.abs(dx)+Math.abs(dy)>4)d.moved=true;if(!d.moved)return;

const CF=[["cTitle","title","input"],["cAuthor","author","input"],["cSeries","series","input"],["cIdx","idx","input"],["cFront","front","change"],["cBack","back","change"],["cWrap","wrap","change"],["cSpine","spine","input"],["cSpFont","spineFont","change"],["cSpInk","spineInk","input"],["cSpWrap","spineClear","change"]];

 document.querySelectorAll("#cvtabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==cvTab));

const adjT=()=>$("#aT").value;
function syncAdj(){const a=(S.cover.adj||{})[adjT()]||{};$("#aFit").value=a.fit||"cover";$("#aZ").value=a.z||100;$("#aX").value=a.x||0;$("#aY").value=a.y||0}
function setAdj(k,v){const c=S.cover,t=adjT();c.adj=c.adj||{};c.adj[t]=c.adj[t]||{};c.adj[t][k]=v;restyleCover();save()}
$("#aT").onchange=syncAdj;$("#aFit").onchange=e=>setAdj("fit",e.target.value);
$("#aZ").oninput=e=>setAdj("z",+e.target.value);$("#aX").oninput=e=>setAdj("x",+e.target.value);$("#aY").oninput=e=>setAdj("y",+e.target.value);

$("#spUp").onclick=()=>$("#spIn").click();
$("#spClr").onclick=()=>{delete S.cover.spineImg;refreshCover();save()};
$("#spIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const iw=im.width||300,ih=im.height||300,k=Math.min(1,1100/Math.max(iw,ih)),w=Math.round(iw*k),h=Math.round(ih*k),c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  let a=false;const px=g.getImageData(0,0,w,h).data;for(let i=3;i<px.length;i+=16)if(px[i]<250){a=true;break}
  S.cover.spineImg=c.toDataURL(a?"image/png":"image/jpeg",.88);refreshCover();save()};
 im.onerror=()=>{URL.revokeObjectURL(u);alert("Couldn’t read that image. Try a PNG or JPG.")};im.src=u};
$("#eyeSp").onclick=async()=>{try{const r=await new EyeDropper().open();S.cover.spine=r.sRGBHex;$("#cSpine").value=r.sRGBHex;refreshCover();save()}catch(_){}};

$("#cSpSize").oninput=e=>{S.cover.spineSize=+e.target.value;refreshCover();save()};
$("#spSizeAuto").onclick=()=>{delete S.cover.spineSize;refreshCover();save()};
$("#cSpNum").oninput=e=>{S.cover.spineNum=+e.target.value;refreshCover();save()};
$("#spNumAuto").onclick=()=>{delete S.cover.spineNum;refreshCover();save()};
$("#spInkAuto").onclick=()=>{delete S.cover.spineInk;syncCover();refreshCover();save()};
$("#cSpine").addEventListener("input",()=>{if(!S.cover.spineInk)$("#cSpInk").value=inkOf(S.cover.spine)});
for(let r=0;r<=5;r+=.5)$("#iRate").add(new Option(r?"★".repeat(Math.floor(r))+(r%1?"½":"")+"  ("+r+")":"No rating",r));
function syncInfo(){const f=S.info;$("#iHandle").value=f.handle||"";$("#iRate").value=String(f.rating||0);$("#iBlurb").value=f.blurb||"";renderLinks()}
function renderLinks(){const w=$("#iLinks");w.innerHTML="";
 S.info.links.forEach((x,i)=>{const r=div("lr"),a=document.createElement("input"),u=document.createElement("input"),d=document.createElement("button");
  a.setAttribute("list","iLbl");a.placeholder="Label";a.value=x.l||"";u.type="url";u.placeholder="https://…";u.value=x.u||"";d.textContent="×";d.title="Remove";
  a.oninput=()=>{x.l=a.value;refreshInfo();save()};u.onchange=()=>{x.u=u.value.trim();refreshInfo();save()};
  d.onclick=()=>{S.info.links.splice(i,1);renderLinks();refreshInfo();save()};r.append(a,u,d);w.append(r)});
 $("#iAdd").disabled=S.info.links.length>=8}
$("#iAdd").onclick=()=>{S.info.links.push({l:"",u:""});renderLinks();save()};
$("#iHandle").oninput=e=>{S.info.handle=e.target.value;refreshInfo();save()};
$("#iRate").onchange=e=>{S.info.rating=+e.target.value;refreshInfo();save()};
$("#iBlurb").oninput=e=>{S.info.blurb=e.target.value;refreshInfo();save()};

// ---- menus + keys ----
const closeMenus=()=>document.querySelectorAll(".dd.open").forEach(x=>x.classList.remove("open"));
document.addEventListener("click",e=>{const dd=e.target.closest(".dd");
 document.querySelectorAll(".dd.open").forEach(x=>{if(x!==dd||e.target.closest(".dd-menu button"))x.classList.remove("open")});
 if(dd&&e.target.closest(".ddb"))dd.classList.toggle("open")});
addEventListener("keydown",e=>{const a=document.activeElement,typing=a&&(a.isContentEditable||/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
 if(e.key=="Escape")closeMenus();if(typing)return;
 if(e.key=="Delete")$("#del").click();
 if(e.ctrlKey||e.metaKey){const k=e.key.toLowerCase();if(k=="z"){e.preventDefault();e.shiftKey?redo():undo()}else if(k=="y"){e.preventDefault();redo()}}});

// ---- export / import ----
const slug=()=>(bookName()||"pahina-ni-yue").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"pahina-ni-yue";
const dims=k=>k==0?[CW,PH]:[820,PH];
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function ready(){
 if(document.fonts&&document.fonts.ready)await document.fonts.ready;
 await Promise.all([...page.querySelectorAll("img")].map(i=>i.complete?(i.decode?i.decode().catch(()=>{}):0):new Promise(r=>{i.onload=i.onerror=r})));
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
}
async function snap(){
 if(!window.html2canvas)throw new Error("Export library didn’t load. Check your connection and try again.");
 select(null);document.activeElement.blur();await ready();
 const old=page.style.transform,[W,Hh]=dims(S.pi);page.style.transform="none";
 try{return await html2canvas(page,{scale:2,useCORS:true,backgroundColor:PAPERS[S.paper][1],windowWidth:Math.max(W,innerWidth),windowHeight:Hh+100,scrollX:0,scrollY:-scrollY})}
 finally{page.style.transform=old}
}
async function run(btn,fn){const x=btn.textContent;btn.disabled=true;btn.textContent="Working…";try{await fn()}catch(e){alert(e.message||"Export failed.")}btn.disabled=false;btn.textContent=x}
$("#xImg").onclick=e=>run(e.target,async()=>{const c=await snap();await new Promise(r=>c.toBlob(b=>{dl(b,slug()+(S.pi?"-p"+S.pi:"-cover")+".png");r()},"image/png"))});
$("#xPdf").onclick=e=>run(e.target,async()=>{
 if(!window.jspdf)throw new Error("PDF library didn’t load. Check your connection and try again.");
 const [w0,h0]=dims(0),pdf=new window.jspdf.jsPDF({unit:"px",format:[w0,h0],orientation:"landscape",hotfixes:["px_scaling"]}),keep=S.pi;
 try{for(let k=0;k<S.pages.length;k++){
  S.pi=k;render();await new Promise(r=>setTimeout(r,300));
  const c=await snap(),[w,h]=dims(k);if(k)pdf.addPage([w,h],w>h?"l":"p");
  pdf.addImage(c.toDataURL("image/jpeg",.95),"JPEG",0,0,w,h)}}
 finally{S.pi=keep;render()}
 pdf.save(slug()+".pdf")});
function toMd(){
 const n=bookName()||"My book";
 let s=`---\nmarginalia: 1\nbook: ${n}\nbg: ${S.bg}\npaper: ${S.paper}\nfont: ${S.font}\nsnap: ${S.snap?1:0}\ncover: ${JSON.stringify(S.cover)}\ninfo: ${JSON.stringify(S.info)}\n---\n\n# ${n}\n\n`;
 S.pages.forEach((pg,k)=>{s+=`<!--page-->\n## ${k==0?"Cover":k==1?"Info":"Page "+(k-1)}\n\n`;pg.forEach(i=>{const {id,text,...meta}=i;s+=`<!--item ${JSON.stringify(meta)}-->\n${text||""}\n\n`})});
 return s}
$("#xMd").onclick=()=>{dl(new Blob([toMd()],{type:"text/markdown"}),slug()+".md");dirtyMd=false;$("#saveBtn").textContent="Save & export ▾"};
$("#lMd").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 try{
  const s=(await f.text()).replace(/\r\n/g,"\n"),fm=s.match(/^---\n([\s\S]*?)\n---/);
  if(!fm||!/^marginalia:/m.test(fm[1]))throw 0;
  const g=k=>(fm[1].match(new RegExp("^"+k+":\\s*(.*)$","m"))||[])[1];
  const chunks=s.slice(fm[0].length).split("<!--page-->");if(chunks.length>1)chunks.shift();
  let pages=chunks.map(ch=>{const items=[],re=/<!--item (\{[\s\S]*?\})-->\n?([\s\S]*?)(?=<!--item |$)/g;let m,id=1;
   while((m=re.exec(ch)))items.push({...JSON.parse(m[1]),id:id++,text:m[2].replace(/\s+$/,"")});return items});
  let cover=null;try{cover=g("cover")?JSON.parse(g("cover")):null}catch(_){}
  let info=null;try{info=g("info")?JSON.parse(g("info")):null}catch(_){}
  if(!cover){cover=newCover();pages.unshift([])}
  if(!info){info=newInfo();pages.splice(1,0,[])}
  while(pages.length<2)pages.push([]);
  if(!confirm("Replace the current board with “"+f.name+"”?"))return;
  const p=+g("paper");
  S={bg:["grid","dots","lines","plain"].includes(g("bg"))?g("bg"):"grid",paper:PAPERS[p]?p:0,font:FMAP[g("font")]?g("font"):"Special Elite",snap:g("snap")=="1",cur:S.cur,book:g("book")||S.book,cover:{...newCover(),...cover,...(cover.sFont&&!cover.spineFont?{spineFont:cover.sFont}:{}),...(cover.sInk&&!cover.spineInk?{spineInk:cover.sInk}:{})},info:{...newInfo(),...info},pages,pi:0};
  sel=null;$("#bg").value=S.bg;$("#paper").value=S.paper;$("#font").value=S.font;$("#snap").checked=!!S.snap;paint();render();syncCover();head();save();
 }catch(err){alert("That doesn’t look like a pahina ni yue .md file.")}
};

$("#bg").value=S.bg;$("#paper").value=S.paper;$("#font").value=S.font;$("#snap").checked=!!S.snap;
head();marks();paint();paintCsw();render();syncCover();hist();
